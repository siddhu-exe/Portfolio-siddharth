<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>

  <text x="40" y="54" font-size="28" font-weight="700" fill="#0f172a">Data Pipeline — Raw Football Data → Training Set</text>
  <text x="40" y="82" font-size="15" fill="#475569">Four source datasets are cleaned, rated and engineered into a 256-match training set from World Cups 2006–2018</text>

  <!-- Column labels -->
  <text x="40" y="126" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.4">1 · RAW SOURCES</text>
  <text x="340" y="126" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.4">2 · PROCESSING</text>
  <text x="640" y="126" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.4">3 · FEATURE ARTIFACTS</text>
  <text x="940" y="126" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.4">4 · ML MODELS</text>

  <!-- Col 1: sources -->
  <g>
    <rect x="40" y="142" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="168" font-size="14" font-weight="600" fill="#0f172a">International Match Results</text>
    <text x="54" y="190" font-size="12.5" fill="#475569">19,972 matches · 2006–2026</text>
    <text x="54" y="210" font-size="12" fill="#94a3b8">World Cups, qualifiers, friendlies</text>

    <rect x="40" y="246" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="272" font-size="14" font-weight="600" fill="#0f172a">WC 2022 Match &amp; Player Data</text>
    <text x="54" y="294" font-size="12.5" fill="#475569">12 stat tables · FBref-style</text>
    <text x="54" y="314" font-size="12" fill="#94a3b8">possession, shots, cards</text>

    <rect x="40" y="350" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="376" font-size="14" font-weight="600" fill="#0f172a">Club League Data — Understat</text>
    <text x="54" y="398" font-size="12.5" fill="#475569">6 top leagues · 2015–2022</text>
    <text x="54" y="418" font-size="12" fill="#94a3b8">player form, xG, xA</text>

    <rect x="40" y="454" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="54" y="480" font-size="14" font-weight="600" fill="#0f172a">WC Historical Database</text>
    <text x="54" y="502" font-size="12.5" fill="#475569">25+ tables · 1930–2022</text>
    <text x="54" y="522" font-size="12" fill="#94a3b8">titles, stages, managers</text>
  </g>

  <!-- Col 2: processing -->
  <g>
    <rect x="340" y="142" width="260" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="354" y="170" font-size="14" font-weight="600" fill="#1d4ed8">ELO Rating Engine</text>
    <text x="354" y="192" font-size="12.5" fill="#334155">replays 19,972 matches</text>
    <text x="354" y="212" font-size="12" fill="#64748b">K = 40 · win / draw / loss</text>
    <text x="354" y="234" font-size="12" font-weight="600" fill="#1d4ed8">→ 319 team ratings</text>

    <rect x="340" y="274" width="260" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="354" y="302" font-size="14" font-weight="600" fill="#1d4ed8">Feature Engineering</text>
    <text x="354" y="324" font-size="12.5" fill="#334155">form · head-to-head · xG / xA</text>
    <text x="354" y="344" font-size="12" fill="#64748b">club stats aggregated per</text>
    <text x="354" y="362" font-size="12" fill="#64748b">national team</text>

    <rect x="340" y="406" width="260" height="112" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="354" y="434" font-size="14" font-weight="600" fill="#1d4ed8">Cleaning &amp; Labelling</text>
    <text x="354" y="456" font-size="12.5" fill="#334155">score parsing (2–1 → 2:1)</text>
    <text x="354" y="476" font-size="12" fill="#64748b">targets: H / D / A + flags</text>
    <text x="354" y="496" font-size="12" fill="#64748b">knockout stage markers</text>
  </g>

  <!-- Col 3: artifacts -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <rect x="640" y="142" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="654" y="170" font-size="13.5" font-weight="600" fill="#0f172a" font-family="Inter, system-ui, sans-serif">team_elo.csv</text>
    <text x="654" y="192" font-size="12.5" fill="#475569" font-family="Inter, system-ui, sans-serif">319 teams · ELO rating</text>
    <text x="654" y="212" font-size="12" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">recomputed per match window</text>

    <rect x="640" y="246" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="654" y="274" font-size="13.5" font-weight="600" fill="#0f172a" font-family="Inter, system-ui, sans-serif">team_club_form.csv</text>
    <text x="654" y="296" font-size="12.5" fill="#475569" font-family="Inter, system-ui, sans-serif">59 teams · form · xG · xA</text>
    <text x="654" y="316" font-size="12" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">star-player form score</text>

    <rect x="640" y="350" width="260" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="654" y="378" font-size="13.5" font-weight="600" fill="#0f172a" font-family="Inter, system-ui, sans-serif">team_wc_history.csv</text>
    <text x="654" y="400" font-size="12.5" fill="#475569" font-family="Inter, system-ui, sans-serif">160 teams · titles · stages</text>
    <text x="654" y="420" font-size="12" fill="#94a3b8" font-family="Inter, system-ui, sans-serif">appearances, KO win rates</text>

    <rect x="640" y="454" width="260" height="112" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="654" y="482" font-size="13.5" font-weight="700" fill="#166534" font-family="Inter, system-ui, sans-serif">train_set.csv</text>
    <text x="654" y="504" font-size="12.5" fill="#334155" font-family="Inter, system-ui, sans-serif">256 matches × 44 columns</text>
    <text x="654" y="524" font-size="12" fill="#64748b" font-family="Inter, system-ui, sans-serif">World Cups 2006–2018</text>
    <text x="654" y="544" font-size="12" font-weight="600" fill="#166534" font-family="Inter, system-ui, sans-serif">192 group + 64 knockout</text>
  </g>

  <!-- Col 4: models -->
  <g>
    <rect x="940" y="142" width="300" height="170" rx="12" fill="#0f172a"/>
    <rect x="954" y="156" width="120" height="22" rx="11" fill="#1d4ed8"/>
    <text x="1014" y="171" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">GROUP STAGE</text>
    <text x="954" y="204" font-size="13.5" fill="#e2e8f0">XGBoost · multi:softprob</text>
    <text x="954" y="226" font-size="12.5" fill="#94a3b8">3 classes: H / D / A · 204 trees</text>
    <rect x="954" y="248" width="122" height="26" rx="13" fill="#1e293b"/>
    <text x="1015" y="265" font-size="12.5" font-weight="700" fill="#60a5fa" text-anchor="middle">75% accuracy</text>
    <rect x="1088" y="248" width="100" height="26" rx="13" fill="#1e293b"/>
    <text x="1138" y="265" font-size="12.5" font-weight="700" fill="#60a5fa" text-anchor="middle">F1 0.714</text>
    <text x="954" y="296" font-size="11.5" fill="#64748b">trained on 192 group matches</text>

    <rect x="940" y="342" width="300" height="170" rx="12" fill="#0f172a"/>
    <rect x="954" y="356" width="112" height="22" rx="11" fill="#b45309"/>
    <text x="1010" y="371" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">KNOCKOUT</text>
    <text x="954" y="404" font-size="13.5" fill="#e2e8f0">XGBoost · binary:logistic</text>
    <text x="954" y="426" font-size="12.5" fill="#94a3b8">2 classes: H / A · 145 trees</text>
    <rect x="954" y="448" width="130" height="26" rx="13" fill="#1e293b"/>
    <text x="1019" y="465" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">91.7% accuracy</text>
    <rect x="1096" y="448" width="118" height="26" rx="13" fill="#1e293b"/>
    <text x="1155" y="465" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">ROC-AUC 0.90</text>
    <text x="954" y="496" font-size="11.5" fill="#64748b">trained on 64 knockout matches</text>
  </g>

  <!-- Arrows -->
  <line x1="304" y1="310" x2="334" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="604" y1="310" x2="634" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="904" y1="310" x2="934" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom summary strip -->
  <rect x="40" y="590" width="1200" height="88" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="622" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="1.4">TRAINING SET COMPOSITION</text>
  <text x="60" y="650" font-size="16" font-weight="700" fill="#0f172a">256 matches — 192 group-stage + 64 knockout — from World Cups 2006, 2010, 2014, 2018</text>
  <text x="60" y="670" font-size="12.5" fill="#475569">4 tournaments · 44 columns (37 features + 2 targets + 5 metadata) · every signal encoded for home and away sides</text>
</svg>
