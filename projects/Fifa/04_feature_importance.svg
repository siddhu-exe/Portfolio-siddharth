<svg width="1280" height="880" viewBox="0 0 1280 880" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1280" height="880" fill="#f8fafc"/>

  <text x="40" y="54" font-size="28" font-weight="700" fill="#0f172a">What the Models Learned — Feature Importance by Gain</text>
  <text x="40" y="82" font-size="15" fill="#475569">Share of total split gain across all trees, extracted from the trained XGBoost models</text>

  <!-- Left panel: group model -->
  <g>
    <text x="40" y="152" font-size="15" font-weight="700" fill="#0f172a">GROUP-STAGE MODEL</text>
    <rect x="236" y="136" width="112" height="22" rx="11" fill="#eff6ff"/>
    <text x="292" y="151" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">75% accuracy</text>
    <text x="40" y="176" font-size="12" fill="#94a3b8">top 10 of 37 features</text>

    <line x1="405" y1="195" x2="405" y2="575" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="565" y1="195" x2="565" y2="575" stroke="#e2e8f0" stroke-width="1"/>

    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155" text-anchor="end">
      <text x="235" y="213">elo_diff</text>
      <text x="235" y="251">home_manager_wc_winrate</text>
      <text x="235" y="289">away_wc_titles</text>
      <text x="235" y="327">home_manager_experience</text>
      <text x="235" y="365">home_avg_form_score</text>
      <text x="235" y="403">away_form_last5</text>
      <text x="235" y="441">away_elo_rating</text>
      <text x="235" y="479">home_avg_xA_per_90</text>
      <text x="235" y="517">h2h_win_rate</text>
      <text x="235" y="555">home_wc_titles</text>
    </g>
    <g fill="#1d4ed8">
      <rect x="245" y="200" width="148" height="20" rx="4"/>
      <rect x="245" y="238" width="139" height="20" rx="4"/>
      <rect x="245" y="276" width="130" height="20" rx="4"/>
      <rect x="245" y="314" width="91" height="20" rx="4"/>
      <rect x="245" y="352" width="89" height="20" rx="4"/>
      <rect x="245" y="390" width="87" height="20" rx="4"/>
      <rect x="245" y="428" width="87" height="20" rx="4"/>
      <rect x="245" y="466" width="85" height="20" rx="4"/>
      <rect x="245" y="504" width="82" height="20" rx="4"/>
      <rect x="245" y="542" width="82" height="20" rx="4"/>
    </g>
    <g font-size="12" font-weight="600" fill="#0f172a">
      <text x="401" y="215">6.5%</text>
      <text x="392" y="253">6.1%</text>
      <text x="383" y="291">5.7%</text>
      <text x="344" y="329">4.0%</text>
      <text x="342" y="367">3.9%</text>
      <text x="340" y="405">3.8%</text>
      <text x="340" y="443">3.8%</text>
      <text x="338" y="481">3.7%</text>
      <text x="335" y="519">3.6%</text>
      <text x="335" y="557">3.6%</text>
    </g>
    <line x1="245" y1="575" x2="565" y2="575" stroke="#cbd5e1" stroke-width="1"/>
    <g font-size="11.5" fill="#64748b">
      <text x="245" y="594">0%</text>
      <text x="397" y="594" text-anchor="middle">7%</text>
      <text x="565" y="594" text-anchor="middle">14%</text>
    </g>
  </g>

  <!-- Right panel: knockout model -->
  <g>
    <text x="660" y="152" font-size="15" font-weight="700" fill="#0f172a">KNOCKOUT MODEL</text>
    <rect x="826" y="136" width="130" height="22" rx="11" fill="#fff7ed"/>
    <text x="891" y="151" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">91.7% accuracy</text>
    <text x="660" y="176" font-size="12" fill="#94a3b8">top 10 of 37 features</text>

    <line x1="1025" y1="195" x2="1025" y2="575" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="1185" y1="195" x2="1185" y2="575" stroke="#e2e8f0" stroke-width="1"/>

    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155" text-anchor="end">
      <text x="855" y="213">away_wc_titles</text>
      <text x="855" y="251">elo_diff</text>
      <text x="855" y="289">away_avg_xA_per_90</text>
      <text x="855" y="327">home_elo_rating</text>
      <text x="855" y="365">home_avg_form_score</text>
      <text x="855" y="403">away_avg_form_score</text>
      <text x="855" y="441">home_avg_xA_per_90</text>
      <text x="855" y="479">away_form_last5</text>
      <text x="855" y="517">away_star_player_form</text>
      <text x="855" y="555">away_wc_avg_stage_last3</text>
    </g>
    <g fill="#b45309">
      <rect x="865" y="200" width="315" height="20" rx="4"/>
      <rect x="865" y="238" width="267" height="20" rx="4"/>
      <rect x="865" y="276" width="222" height="20" rx="4"/>
      <rect x="865" y="314" width="180" height="20" rx="4"/>
      <rect x="865" y="352" width="176" height="20" rx="4"/>
      <rect x="865" y="390" width="176" height="20" rx="4"/>
      <rect x="865" y="428" width="167" height="20" rx="4"/>
      <rect x="865" y="466" width="153" height="20" rx="4"/>
      <rect x="865" y="504" width="139" height="20" rx="4"/>
      <rect x="865" y="542" width="103" height="20" rx="4"/>
    </g>
    <g font-size="12" font-weight="600" fill="#0f172a">
      <text x="1188" y="215">13.8%</text>
      <text x="1140" y="253">11.7%</text>
      <text x="1095" y="291">9.7%</text>
      <text x="1053" y="329">7.9%</text>
      <text x="1049" y="367">7.7%</text>
      <text x="1049" y="405">7.7%</text>
      <text x="1040" y="443">7.3%</text>
      <text x="1026" y="481">6.7%</text>
      <text x="1012" y="519">6.1%</text>
      <text x="976" y="557">4.5%</text>
    </g>
    <line x1="865" y1="575" x2="1185" y2="575" stroke="#cbd5e1" stroke-width="1"/>
    <g font-size="11.5" fill="#64748b">
      <text x="865" y="594">0%</text>
      <text x="1017" y="594" text-anchor="middle">7%</text>
      <text x="1185" y="594" text-anchor="middle">14%</text>
    </g>
  </g>

  <text x="640" y="622" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-style="italic">both panels share the same 0–14% scale</text>

  <!-- Insight box -->
  <g>
    <rect x="40" y="650" width="1200" height="180" rx="12" fill="#0f172a"/>
    <text x="60" y="684" font-size="14" font-weight="700" fill="#ffffff">What this reveals</text>
    <g font-size="13" fill="#cbd5e1">
      <circle cx="68" cy="710" r="3" fill="#60a5fa"/>
      <text x="82" y="715">Group play: influence is spread evenly — the top feature (elo_diff) carries only 6.5% of gain; form, manager quality and pedigree all matter together.</text>
      <circle cx="68" cy="742" r="3" fill="#fbbf24"/>
      <text x="82" y="747">Knockouts: pedigree concentrates — away_wc_titles alone holds 13.8%, and the top 3 features carry 35% of all gain.</text>
      <circle cx="68" cy="774" r="3" fill="#60a5fa"/>
      <text x="82" y="779">elo_diff ranks top-2 in both models — relative strength, built by replaying 19,972 matches, is the backbone signal.</text>
    </g>
  </g>
</svg>
