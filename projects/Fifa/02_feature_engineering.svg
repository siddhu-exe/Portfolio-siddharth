<svg width="1280" height="920" viewBox="0 0 1280 920" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1280" height="920" fill="#f8fafc"/>

  <text x="40" y="54" font-size="28" font-weight="700" fill="#0f172a">37 Engineered Features — 7 Families</text>
  <text x="40" y="82" font-size="15" fill="#475569">Every team-level signal is encoded for both sides of a match (home / away)</text>

  <!-- Row 1 -->
  <!-- ELO -->
  <g>
    <rect x="40" y="120" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="120" width="386" height="4" rx="2" fill="#1d4ed8"/>
    <circle cx="60" cy="148" r="5" fill="#1d4ed8"/>
    <text x="74" y="153" font-size="15" font-weight="700" fill="#0f172a">ELO Ratings</text>
    <rect x="356" y="138" width="56" height="22" rx="11" fill="#eff6ff"/>
    <text x="384" y="153" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">3</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="60" y="186">home_elo_rating</text>
      <text x="60" y="208">away_elo_rating</text>
      <text x="60" y="230">elo_diff</text>
    </g>
    <text x="60" y="268" font-size="11.5" fill="#94a3b8" font-style="italic">computed by replaying 19,972 international</text>
    <text x="60" y="286" font-size="11.5" fill="#94a3b8" font-style="italic">matches through the ELO engine</text>
  </g>

  <!-- Recent Form -->
  <g>
    <rect x="447" y="120" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="447" y="120" width="386" height="4" rx="2" fill="#1d4ed8"/>
    <circle cx="467" cy="148" r="5" fill="#1d4ed8"/>
    <text x="481" y="153" font-size="15" font-weight="700" fill="#0f172a">Recent Form</text>
    <rect x="763" y="138" width="56" height="22" rx="11" fill="#eff6ff"/>
    <text x="791" y="153" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">4</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="467" y="186">home_form_last5 / last10</text>
      <text x="467" y="208">away_form_last5 / last10</text>
    </g>
    <text x="467" y="246" font-size="11.5" fill="#94a3b8" font-style="italic">rolling match-result windows —</text>
    <text x="467" y="264" font-size="11.5" fill="#94a3b8" font-style="italic">captures momentum going into the cup</text>
  </g>

  <!-- Head-to-Head -->
  <g>
    <rect x="854" y="120" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="854" y="120" width="386" height="4" rx="2" fill="#b45309"/>
    <circle cx="874" cy="148" r="5" fill="#b45309"/>
    <text x="888" y="153" font-size="15" font-weight="700" fill="#0f172a">Head-to-Head</text>
    <rect x="1170" y="138" width="56" height="22" rx="11" fill="#fff7ed"/>
    <text x="1198" y="153" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">9</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="874" y="186">h2h_win_rate · goal_diff_avg</text>
      <text x="874" y="208">h2h_wc_win_rate</text>
    </g>
    <text x="874" y="234" font-size="12" fill="#64748b">each metric × { overall, home, away }</text>
    <text x="874" y="268" font-size="11.5" fill="#94a3b8" font-style="italic">historic matchup edge between</text>
    <text x="874" y="286" font-size="11.5" fill="#94a3b8" font-style="italic">the two specific teams</text>
  </g>

  <!-- Row 2 -->
  <!-- Player Quality -->
  <g>
    <rect x="40" y="342" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="342" width="386" height="4" rx="2" fill="#b45309"/>
    <circle cx="60" cy="370" r="5" fill="#b45309"/>
    <text x="74" y="375" font-size="15" font-weight="700" fill="#0f172a">Player Quality</text>
    <rect x="356" y="360" width="56" height="22" rx="11" fill="#fff7ed"/>
    <text x="384" y="375" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">8</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="60" y="408">avg_form_score · star_player_form</text>
      <text x="60" y="430">avg_xG_per_90 · avg_xA_per_90</text>
    </g>
    <text x="60" y="456" font-size="12" fill="#64748b">each metric × { home, away }</text>
    <text x="60" y="490" font-size="11.5" fill="#94a3b8" font-style="italic">aggregated from 6 club leagues (Understat):</text>
    <text x="60" y="508" font-size="11.5" fill="#94a3b8" font-style="italic">EPL, La Liga, Bundesliga, Serie A, Ligue 1, RFPL</text>
  </g>

  <!-- WC Pedigree -->
  <g>
    <rect x="447" y="342" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="447" y="342" width="386" height="4" rx="2" fill="#166534"/>
    <circle cx="467" cy="370" r="5" fill="#166534"/>
    <text x="481" y="375" font-size="15" font-weight="700" fill="#0f172a">World Cup Pedigree</text>
    <rect x="763" y="360" width="56" height="22" rx="11" fill="#f0fdf4"/>
    <text x="791" y="375" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">8</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="467" y="408">wc_avg_stage_last3</text>
      <text x="467" y="430">knockout_win_rate · wc_titles</text>
      <text x="467" y="452">prior_appearances</text>
    </g>
    <text x="467" y="478" font-size="12" fill="#64748b">each metric × { home, away }</text>
    <text x="467" y="512" font-size="11.5" fill="#94a3b8" font-style="italic">tournament experience &amp; historical depth</text>
  </g>

  <!-- Manager -->
  <g>
    <rect x="854" y="342" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="854" y="342" width="386" height="4" rx="2" fill="#166534"/>
    <circle cx="874" cy="370" r="5" fill="#166534"/>
    <text x="888" y="375" font-size="15" font-weight="700" fill="#0f172a">Manager</text>
    <rect x="1170" y="360" width="56" height="22" rx="11" fill="#f0fdf4"/>
    <text x="1198" y="375" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">4</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="874" y="408">manager_wc_winrate</text>
      <text x="874" y="430">manager_experience</text>
    </g>
    <text x="874" y="456" font-size="12" fill="#64748b">each metric × { home, away }</text>
    <text x="874" y="490" font-size="11.5" fill="#94a3b8" font-style="italic">bench leadership &amp; big-stage know-how</text>
  </g>

  <!-- Row 3 -->
  <!-- Context -->
  <g>
    <rect x="40" y="564" width="386" height="202" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="564" width="386" height="4" rx="2" fill="#475569"/>
    <circle cx="60" cy="592" r="5" fill="#475569"/>
    <text x="74" y="597" font-size="15" font-weight="700" fill="#0f172a">Match Context</text>
    <rect x="356" y="582" width="56" height="22" rx="11" fill="#f1f5f9"/>
    <text x="384" y="597" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1</text>
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#334155">
      <text x="60" y="630">knockout_flag</text>
    </g>
    <text x="60" y="666" font-size="11.5" fill="#94a3b8" font-style="italic">stage awareness — lets shared logic branch</text>
    <text x="60" y="684" font-size="11.5" fill="#94a3b8" font-style="italic">between group play and elimination rounds</text>
  </g>

  <!-- Design principles -->
  <g>
    <rect x="447" y="564" width="793" height="202" rx="12" fill="#0f172a"/>
    <text x="467" y="598" font-size="14" font-weight="700" fill="#ffffff">Design Principles</text>
    <g font-size="13" fill="#cbd5e1">
      <circle cx="475" cy="624" r="3" fill="#60a5fa"/>
      <text x="489" y="629">Symmetric encoding — every signal exists for both the home and the away perspective</text>
      <circle cx="475" cy="654" r="3" fill="#60a5fa"/>
      <text x="489" y="659">elo_diff condenses relative strength into a single high-signal feature</text>
      <circle cx="475" cy="684" r="3" fill="#60a5fa"/>
      <text x="489" y="689">Club-level xG / xA proxy national-team attacking and creative quality</text>
      <circle cx="475" cy="714" r="3" fill="#60a5fa"/>
      <text x="489" y="719">Leakage-safe — only pre-match information enters the feature vector</text>
    </g>
  </g>

  <!-- Footer chips -->
  <g font-size="12.5" font-weight="600">
    <rect x="40" y="800" width="150" height="32" rx="16" fill="#eff6ff"/>
    <text x="115" y="821" fill="#1d4ed8" text-anchor="middle">37 features</text>
    <rect x="204" y="800" width="150" height="32" rx="16" fill="#eff6ff"/>
    <text x="279" y="821" fill="#1d4ed8" text-anchor="middle">44 total columns</text>
    <rect x="368" y="800" width="210" height="32" rx="16" fill="#fff7ed"/>
    <text x="473" y="821" fill="#b45309" text-anchor="middle">2 targets: group / knockout</text>
    <rect x="592" y="800" width="180" height="32" rx="16" fill="#fff7ed"/>
    <text x="682" y="821" fill="#b45309" text-anchor="middle">5 metadata columns</text>
    <rect x="786" y="800" width="220" height="32" rx="16" fill="#f0fdf4"/>
    <text x="896" y="821" fill="#166534" text-anchor="middle">48 teams · 12 groups (2026)</text>
  </g>
</svg>
